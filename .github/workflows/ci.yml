name: AEGIS CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # Lint: catch duplicate function definitions and obvious style issues.
      # We use ruff (fast, covers pycodestyle + more) and a custom check.
      # -----------------------------------------------------------------------
      - name: Install lint tools
        run: pip install ruff

      - name: Run ruff linter
        run: |
          ruff check src/ --select E,F,W --ignore E501

      # Enforcement: no function/class should be defined more than once
      # across the src/ directory (the core Phase 0 correctness invariant).
      - name: Check for duplicate function definitions
        run: |
          python - <<'EOF'
          import ast, sys, os, pathlib
          from collections import defaultdict

          defs = defaultdict(list)
          src = pathlib.Path("src")
          for py_file in src.glob("*.py"):
              tree = ast.parse(py_file.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      defs[node.name].append(str(py_file))

          duplicates = {name: files for name, files in defs.items() if len(files) > 1}
          if duplicates:
              print("ERROR: Duplicate function definitions found across src/:")
              for name, files in duplicates.items():
                  print(f"  {name}: {files}")
              sys.exit(1)
          else:
              print("OK: No duplicate function definitions found.")
          EOF

      # -----------------------------------------------------------------------
      # Tests with coverage
      # -----------------------------------------------------------------------
      - name: Run test suite with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --tb=short \
            -v
        env:
          PYTHONPATH: src

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
